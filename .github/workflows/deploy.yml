name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.10'

jobs:
  # Этап 1: Тестирование и валидация фронтенда
  test-frontend:
    name: Test Frontend Assets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        npm install -g postcss-cli cssnano clean-css-cli html-minifier-terser

    - name: Lint CSS files
      run: |
        if [ -d "src/css" ]; then
          npx stylelint "src/css/**/*.css" || true
        fi

    - name: Check JavaScript syntax
      run: |
        if [ -d "src/js" ]; then
          npx eslint "src/js/**/*.js" --no-eslintrc --config='{"extends":"eslint:recommended"}' || true
        fi

  # Этап 2: Сборка статики с PostCSS
  build-assets:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        npm install -g postcss-cli cssnano autoprefixer postcss-preset-env

    - name: Build CSS with PostCSS
      run: |
        if [ -d "src/css" ]; then
          postcss src/css/**/*.css --dir assets/css/ --config postcss.config.js --env production
          echo "✅ CSS built with PostCSS"
        else
          echo "⚠️ No src/css directory found"
        fi

    - name: Minify CSS
      run: |
        if [ -d "assets/css" ]; then
          find assets/css -name "*.css" -exec npx cleancss -o {} {} \;
          echo "✅ CSS minified"
        fi

    - name: Process JavaScript
      run: |
        if [ -d "src/js" ]; then
          mkdir -p assets/js
          for jsfile in src/js/*.js; do
            if [ -f "$jsfile" ]; then
              filename=$(basename "$jsfile")
              npx terser "$jsfile" -o "assets/js/${filename}" --compress --mangle
            fi
          done
          echo "✅ JavaScript processed"
        fi

    - name: Upload assets artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-assets
        path: assets/
        retention-days: 1

  # Этап 3: Валидация HTML
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    needs: build-assets

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download assets
      uses: actions/download-artifact@v4
      with:
        name: frontend-assets
        path: assets/

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install MkDocs
      run: |
        pip install mkdocs mkdocs-material
        pip install mkdocs-minify-plugin mkdocs-redirects

    - name: Build site for validation
      run: |
        mkdocs build --site-dir ./build --strict
        echo "✅ Site built for validation"

    - name: Install HTML validator
      run: |
        sudo apt-get update
        sudo apt-get install -y vnu-jar

    - name: Validate HTML files
      run: |
        echo "Validating HTML files..."
        java -jar /usr/share/java/vnu.jar --filterpattern ".*" build/ || true

    - name: Check for broken links
      run: |
        pip install linkchecker
        linkchecker build/ --check-extern --no-status --no-warnings || true

  # Этап 4: Сборка сайта с минификацией
  build-site:
    name: Build Site with Minification
    runs-on: ubuntu-latest
    needs: [validate-html, build-assets]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download assets
      uses: actions/download-artifact@v4
      with:
        name: frontend-assets
        path: assets/

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install build dependencies
      run: |
        pip install mkdocs mkdocs-material
        pip install mkdocs-minify-plugin mkdocs-redirects html-minifier-terser

    - name: Build site with minification
      run: |
        mkdocs build --site-dir ./site --clean

    - name: Minify HTML files
      run: |
        if command -v html-minifier-terser &> /dev/null; then
          find site -name "*.html" -exec html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-optional-tags \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-tag-whitespace \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            -o {} {} \;
          echo "✅ HTML minified"
        fi

    - name: Optimize images
      run: |
        if command -v convert &> /dev/null; then
          find site -name "*.jpg" -exec convert {} -strip -quality 85 {} \;
          find site -name "*.png" -exec convert {} -strip {} \;
          echo "✅ Images optimized"
        else
          echo "⚠️ ImageMagick not available for image optimization"
        fi

    - name: Generate sitemap
      run: |
        pip install mkdocs-sitemap
        mkdocs build --site-dir ./site

    - name: Calculate file sizes
      run: |
        echo "📊 Build size report:"
        du -sh site/
        find site -name "*.html" -exec wc -l {} \; | awk '{total += $1} END {print "Total HTML lines:", total}'
        find site -name "*.css" -exec wc -c {} \; | awk '{total += $1} END {print "Total CSS bytes:", total}'
        find site -name "*.js" -exec wc -c {} \; | awk '{total += $1} END {print "Total JS bytes:", total}'

  # Этап 5: Деплой на GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-site
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download built site
      uses: actions/download-artifact@v4
      with:
        name: built-site
        path: site/

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: 'site'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2

    - name: Save build artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-site
        path: site/
        retention-days: 30
